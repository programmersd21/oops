[package]
name = "oops"
description = "Undo daemon for destructive shell commands"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "../README.md"

[[bin]]
name = "oops"
path = "src/main.rs"

[dependencies]
oops-core = { path = "../oops-core" }
oops-tui = { path = "../oops-tui" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
sd-notify = "0.4"
